server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy all /api/* requests to the backend container
    location /api/ {
        proxy_pass            http://backend:5020/api/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        # AI CV-extraction can run several minutes on CPU-only inference; keep
        # this comfortably above ai.ollama.timeout-seconds (backend-java) so the
        # backend's own graceful fallback fires before nginx would cut the client off.
        proxy_read_timeout    210s;
        client_max_body_size  15m;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://backend:5020/actuator/health;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
